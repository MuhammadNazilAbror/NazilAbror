# CareerCanvas theme – example config
# Copy sections into your site config.toml and replace placeholders.
# For running the site, see the Portfolio repo README: https://github.com/felipecordero/felipecordero.github.io

baseURL = "https://nazilabror.netlify.app"
locale = "id-id"
title = "Muhammad Nazil Abror"
theme = "careercanvas"
defaultContentLanguage = "id"
defaultContentLanguageInSubdir = false

[languages]
  [languages.id]
    contentDir = "content/id"
    label = "Bahasa Indonesia"
    weight = 1
    [languages.id.params]
      tagline = "Saya adalah siswa SMK Wikrama Bogor tahun ajaran 2025/2026."
      hero_description = "Jurusan saya adalah TJKT (Teknik Jaringan Komputer dan Telekomunikasi). Saya mempelajari Networking, MikroTik, sistem operasi Linux, dan Cyber Security."
      hero_location = "Bogor, Jawa Barat, Indonesia"
      collab_tags = ["Networking", "Linux", "Cyber Security"]
      resume_url = "/files/nazil-cv-id.pdf"
    [[languages.id.menu.main]]
      name = "Tentang"
      url = "#about"
      weight = 1
    [[languages.id.menu.main]]
      name = "Postingan"
      url = "#portfolio"
      weight = 2
    [[languages.id.menu.main]]
      name = "Kontak"
      url = "#contact"
      weight = 3
  [languages.en]
    contentDir = "content/en"
    label = "English"
    weight = 2
    [languages.en.params]
      tagline = "I am a student at Wikrama Bogor Vocational School for the 2025/2026 academic year."
      hero_description = "My mayor is TJKT (Network and Telecommunications Engineering). My studies cover Networking, MikroTik, Linux operating system and Cyber Security."
      hero_location = "Bogor, Jawa Barat, Indonesia"
      collab_tags = ["Tag 1", "Tag 2", "Tag 3"]
      resume_url = "/files/nazil-cv-en.pdf"
    [[languages.en.menu.main]]
      name = "About"
      url = "#about"
      weight = 1
    [[languages.en.menu.main]]
      name = "Post"
      url = "#portfolio"
      weight = 2
    [[languages.en.menu.main]]
      name = "Contact"
      url = "#contact"
      weight = 3
  # Add more [languages.xx] blocks for other languages (es, fr, etc.)

[build]
  writeStats = true

[params]
  name = "Muhammad Nazil Abror"
  firstName = "Muhammad Nazil"
  lastName = "Abror"
  email = "nazilabror225@gmail.com"
  profile_image = "/images/Profile.jpeg"
  author = "Muhammad Nazil Abror"
  og_image = "images/og-image.png"
  description = "One-line site description for SEO."
  linkedin_url = "https://www.linkedin.com/in/muhammad-nazil-abror-513a01423"
  linkedin_text = "linkedin.com/in/NazilAbror"
  github_url = "https://github.com/MuhammadNazilAbror"
  github_text = "github.com/MuhammadNazilAbror"
  calendly_url = ""
  calendly_height = "700px"
  copyright = "© 2026 | Muhammad Nazil Abror"
  resume_url_en = "/files/your-cv-en.pdf"
  resume_url_fr = "/files/your-cv-fr.pdf"
  resume_label = "View CV"
  sectionPagesMenu = "main"
  formspreeendpoint = "https://formspree.io/f/xdenewve"
  pexelsapikey = ""

  # Custom local hero background image (used instead of Pexels).
  # Place your wallpaper file at static/images/hero-bg.jpg
  hero_bg_image = "/images/hero-bg.jpg"

  [[params.social]]
    icon = "linkedin-in"
    url = "https://www.linkedin.com/in/muhammad-nazil-abror-513a01423"
  [[params.social]]
    icon = "github"
    url = "https://github.com/MuhammadNazilAbror"
  # [[params.social]]
  #   icon = "calendly"
  #   url = "https://calendly.com/yourlink"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

[security]
  [security.exec]
    allow = ['^postcss$', '^tailwind$', '^npx$', '^node$']
    osEnv = ['(?i)^PATH$', '(?i)^PATHEXT$', '(?i)^NODE_OPTIONS$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^NODE_OPTIONS$']

# One palette is picked at random per page load. Each needs name, main_color, second_color, third_color (hex).
[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "professional"
    main_color = "#474A51"
    second_color = "#E52521"
    third_color = "#3CB043"
  [[params.color_palettes.palette]]
    name = "ocean"
    main_color = "#1E40AF"
    second_color = "#06B6D4"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "steel"
    main_color = "#374151"
    second_color = "#6B7280"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "slate"
    main_color = "#475569"
    second_color = "#0EA5E9"
    third_color = "#F97316"

# Pexels hero backgrounds (theme requires at least 1 query or build fails).
# The actual hero image will be overridden by CSS to use your local hero-bg.jpg instead.
[params.pexels]
  queries = ["abstract background"]