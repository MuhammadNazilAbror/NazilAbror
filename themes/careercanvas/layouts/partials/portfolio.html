<!-- Portfolio Section -->
<section id="portfolio" class="py-12 bg-bg dark:bg-bg portfolio-section border-t border-border-primary" data-animate>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    {{ with .Site.GetPage "/portfolio" }}
      <h2 class="text-3xl font-bold text-center mb-4 font-heading text-text-primary dark:text-text-primary">{{ .Title }}</h2>
      {{ with .Params.intro }}
      <p class="text-lg text-center mb-12 text-text-secondary dark:text-text-tertiary italic">{{ . }}</p>
      {{ end }}

      {{ range .Params.categories }}
      <div class="mb-10">
        <h3 class="text-xl font-heading font-bold mb-6 flex items-center text-text-primary dark:text-text-primary">
          <i class="fas fa-{{ .icon | default "folder" }} text-primary dark:text-primary-light mr-3"></i>
          {{ .name }}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          {{ range .items }}
          <a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
             class="bg-bg-secondary dark:bg-bg-secondary p-6 rounded-xl shadow-md portfolio-card border border-border-primary dark:border-border-primary card-hover block">
            <div class="flex items-center mb-3">
              <i class="fas fa-{{ .icon | default "file-lines" }} text-2xl mr-3 text-primary dark:text-primary-light"></i>
              <h4 class="text-base font-heading font-bold text-text-primary dark:text-text-primary">{{ .title }}</h4>
            </div>
            <p class="text-text-secondary dark:text-text-tertiary text-sm leading-relaxed mb-3">{{ .description }}</p>
            <span class="inline-flex items-center text-primary dark:text-primary-light text-sm font-semibold">
              Lihat Jobsheet <i class="fas fa-arrow-right ml-2 text-xs"></i>
            </span>
          </a>
          {{ end }}
        </div>
      </div>
      {{ end }}
    {{ end }}
  </div>
</section>
